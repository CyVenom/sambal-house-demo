<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sambal House: handcrafted Malaysian chili pastes, made fresh in small batches. A static demo of a university e-commerce project.">
<title>Your Cart - Sambal House 🌶️</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/demo.css">
<link rel="stylesheet" href="/assets/css/cart.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/assets/seed.js"></script>
<script src="/assets/app.js"></script>
</head>
<body>
<div id="nav-root"></div>
<header class="page-header"><div class="page-header-inner"><div class="ph-icon"><i class="fas fa-cart-shopping"></i></div><div><h1>Your Cart</h1><p>Review your spicy picks before checkout</p></div></div></header>
<div class="container" id="cartRoot"></div>
<script>
SH.ready(function () {
  if (!SH.requireUser('Please sign in to view your cart.')) return;
  var root = document.getElementById('cartRoot');
  function draw() {
    var items = SH.cartItems();
    if (!items.length) { root.innerHTML = '<div class="empty-card"><div class="big-emoji">🛒</div><h3>Your cart is empty</h3><p style="color:var(--muted);margin-bottom:24px">Looks like you haven\'t added anything yet.</p><a href="/index.html#shop" class="btn btn-primary">Browse Products</a></div>'; return; }
    var total = 0;
    var rows = items.map(function (i) {
      var q = Math.min(i.qty, i.product.stock), sub = i.product.price * q; total += sub;
      return '<tr data-pid="' + i.product.id + '"><td data-label="Product">' + SH.esc(i.product.name) + '</td><td data-label="Price">RM ' + SH.money(i.product.price) + '</td><td data-label="Qty"><div class="qty-stepper"><button type="button" class="qty-btn" data-d="-1">−</button><input type="number" min="0" max="' + i.product.stock + '" value="' + q + '"><button type="button" class="qty-btn" data-d="1">+</button></div>' +
        (i.product.stock === 0 ? '<div class="muted" style="font-size:.85rem">Out of stock</div>' : i.qty > i.product.stock ? '<div class="muted" style="font-size:.85rem">Capped at ' + i.product.stock + '</div>' : '') + '</td><td data-label="Subtotal">RM ' + SH.money(sub) + '</td></tr>';
    }).join('');
    root.innerHTML = '<table class="table"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead><tbody>' + rows + '<tr><td colspan="3" style="text-align:right"><b>Total</b></td><td><b>RM ' + SH.money(total) + '</b></td></tr></tbody></table>' +
      '<button class="btn" id="updBtn">Update Cart</button> <button class="btn btn-primary" id="coBtn">Checkout</button>';
    Array.prototype.forEach.call(root.querySelectorAll('.qty-btn'), function (b) { b.addEventListener('click', function () { var inp = b.parentElement.querySelector('input'); var v = parseInt(inp.value, 10) + parseInt(b.dataset.d, 10); inp.value = Math.min(parseInt(inp.max, 10), Math.max(0, v)); }); });
    function apply() { Array.prototype.forEach.call(root.querySelectorAll('tr[data-pid]'), function (tr) { SH.setCartQty(parseInt(tr.dataset.pid, 10), parseInt(tr.querySelector('input').value, 10) || 0); }); }
    document.getElementById('updBtn').addEventListener('click', function () { apply(); SH.updateNavCounts(); draw(); Swal.fire({ icon: 'success', title: 'Cart updated', text: 'Your cart has been refreshed.', timer: 1500, showConfirmButton: false }); });
    document.getElementById('coBtn').addEventListener('click', function () { apply(); location.href = '/checkout.html'; });
  }
  draw();
});
</script>
<div id="footer-root"></div>
</body>
</html>
