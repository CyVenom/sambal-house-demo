<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sambal House: handcrafted Malaysian chili pastes. A static demo of a university e-commerce project.">
<title>Order - Sambal House 🌶️</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/demo.css">
<link rel="stylesheet" href="/assets/css/checkout.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/assets/seed.js"></script>
<script src="/assets/app.js"></script>
</head>
<body>
<div id="nav-root" data-mode="admin"></div>
<header class="page-header"><div class="page-header-inner"><div class="ph-icon"><i class="fas fa-file-invoice"></i></div><div><h1 id="oTitle">Order</h1><p>Customer, items and delivery details</p></div></div></header>
<div class="container" id="oRoot"></div>
<script>
SH.ready(function () {
  if (!SH.requireAdmin()) return;
  var id = parseInt(new URLSearchParams(location.search).get('id'), 10), o = SH.orderById(id, true);
  if (!o) { document.getElementById('oRoot').innerHTML = '<p>Order not found. <a href="/admin/orders.html">Back to orders</a></p>'; return; }
  document.getElementById('oTitle').textContent = 'Order #' + o.id;
  document.getElementById('oRoot').innerHTML = '<a href="/admin/orders.html" class="back-button">Back to Orders</a>' +
    '<div class="co-card" style="margin-bottom:18px"><div class="co-card-header"><i class="fas fa-user"></i> Customer</div><div class="co-card-body" style="line-height:1.9">' + SH.esc(o.full_name) + '<br>' + SH.esc(o.email) + (o.phone ? '<br>' + SH.esc(o.phone) : '') + '<br><b>Status:</b> ' + o.status + ' &nbsp;·&nbsp; <b>Payment:</b> ' + o.payment_method + (o.bank ? ' (' + SH.esc(SH.BANKS[o.bank] ? SH.BANKS[o.bank].short : o.bank) + ')' : '') + '<br><b>Placed:</b> ' + SH.fmtDate(o.created_at) + '</div></div>' +
    '<div class="co-card" style="margin-bottom:18px"><div class="co-card-header"><i class="fas fa-map-marker-alt"></i> Delivery Address</div><div class="co-card-body" style="line-height:1.9">' + SH.esc(o.address_line1) + (o.address_line2 ? '<br>' + SH.esc(o.address_line2) : '') + '<br>' + SH.esc(o.postcode) + ' ' + SH.esc(o.city) + ', ' + SH.esc(o.state_region) + '<br>' + SH.esc(o.country) + '</div></div>' +
    '<table class="table"><thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead><tbody>' + o.items.map(function (i) { return '<tr><td>' + SH.esc(i.name) + '</td><td>RM ' + SH.money(i.price) + '</td><td>' + i.qty + '</td><td>RM ' + SH.money(i.price * i.qty) + '</td></tr>'; }).join('') + '<tr><td colspan="3" style="text-align:right"><b>Total</b></td><td><b>RM ' + SH.money(o.total) + '</b></td></tr></tbody></table>';
});
</script>
<div id="footer-root"></div>
</body>
</html>
